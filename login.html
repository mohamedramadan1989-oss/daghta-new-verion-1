<style>
:root{--ink:#0e1f3b;--navy:#12386f;--brand:#0878f9;--soft:#e6f1ff;--bg:#f5f7fb;--line:#e1e6ef;--muted:#5f6c82;--err:#d92d20;--ok:#0f9d6b}
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.lang{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;min-height:40px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;padding:10px 16px}
.btn:hover{background:#0665d1}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:500}.btn.alt:hover{background:#f5f7fb}
.btn.alt b{color:#4285f4;font-size:19px}
.btn.busy{opacity:.7;pointer-events:none}
.btn.busy::after{content:"";width:16px;height:16px;border:2px solid rgba(128,128,128,.4);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.f{margin-bottom:14px}
.f label{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;min-height:48px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px;color:var(--ink)}
.f textarea{min-height:120px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(8,120,249,.15)}
.pw{position:relative}.pw input{padding-inline-end:50px}
.eye{position:absolute;inset-inline-end:2px;top:0;height:48px;width:46px;background:none;border:0;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye .ic{width:22px;height:22px;position:static}
.eye .eye-off,.eye.on .eye-open{display:none}.eye.on .eye-off{display:block}
.msg{display:none;padding:10px 14px;border-radius:10px;font-size:14px;margin-bottom:14px}
.msg.err{display:block;background:#fef3f2;color:var(--err);border:1px solid #fecdca}
.msg.ok{display:block;background:#effaf5;color:#0b7a53;border:1px solid #b7e8d3}
.lnk{background:none;border:0;color:var(--brand);font-size:14px;font-weight:500;cursor:pointer;padding:8px 0;text-decoration:underline}
.row-end{display:flex;justify-content:flex-end;margin:-6px 0 8px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
[hidden]{display:none!important}

/* الدخول */
.auth{flex:1;display:grid;grid-template-columns:minmax(320px,.9fr) 1.1fr}
.brandpane{background:radial-gradient(700px 360px at 90% 0,rgba(8,120,249,.4),transparent 70%),linear-gradient(165deg,var(--ink),var(--navy));color:#fff;padding:28px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.bp-logo{height:34px !important;max-height:34px !important;width:auto !important;max-width:140px !important;object-fit:contain !important;display:block !important}
.bp-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.form-logo-box{display:none;text-align:center;margin-bottom:18px}
.form-logo-img{height:34px !important;max-height:34px !important;width:auto !important;max-width:140px !important;object-fit:contain !important;display:inline-block !important;margin:0 auto 15px auto !important}
.bp-body h1{font-size:30px;line-height:1.4;font-weight:700;max-width:14em}
.bp-body p{opacity:.85;margin-top:8px}
.bp-list{list-style:none;display:grid;gap:14px;margin-top:28px}
.bp-list li{display:flex;gap:12px;align-items:center}
.bp-list .ic{width:38px;height:38px;padding:9px;border-radius:11px;background:rgba(255,255,255,.12)}
.formpane{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.card{width:100%;max-width:420px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e6eaf2;border-radius:12px;padding:4px;margin-bottom:20px}
.tabs button{min-height:44px;border:0;border-radius:9px;background:transparent;font-size:15px;font-weight:500;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 8px rgba(14,31,59,.1)}
.card h2{font-size:21px;margin-bottom:4px}.card .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:14px}
.chk input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--brand)}
.back{display:block;text-align:center;margin-top:20px;font-size:14px}
@media(max-width:820px){
 .auth{grid-template-columns:1fr;min-height:0}
 .brandpane{padding:16px 5% 20px;gap:12px}.bp-list{display:none}.bp-body h1{font-size:20px}.bp-body p{font-size:14px;margin-top:2px}.bp-logo{height:70px;width:auto;object-fit:contain;margin:0 auto}
 .form-logo-box{display:block}
 .formpane{align-items:flex-start;padding:22px 5% calc(28px + env(safe-area-inset-bottom))}
}

/* اتصل بنا */
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 5%}
.top .logo, header img[src*="Daghta"], nav img[src*="Daghta"]{height:32px !important;max-height:32px !important;width:auto !important;max-width:140px !important;object-fit:contain !important;display:block !important}.sp{flex:1}
@media(max-width:768px){.top .logo, header img[src*="Daghta"], nav img[src*="Daghta"]{height:32px !important;max-height:32px !important}}
.btn-sm{background:var(--brand);color:#fff;border-radius:10px;min-height:40px;display:inline-flex;align-items:center;padding:6px 16px;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.chero{background:linear-gradient(165deg,var(--ink),var(--navy));color:#fff;padding:34px 5% 54px}
.chero>div{max-width:1050px;margin:auto}
.chero h1{font-size:clamp(25px,4.6vw,38px);line-height:1.35}.chero p{opacity:.85;margin-top:6px;max-width:34em}
.contact{max-width:1050px;width:100%;margin:-30px auto 0;padding:0 5% 40px;display:grid;grid-template-columns:1.25fr .75fr;gap:20px;flex:1}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 28px rgba(14,31,59,.07)}
.panel h2{font-size:18px;margin-bottom:12px}
.side{display:flex;flex-direction:column;gap:12px;align-self:start}
.chan{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);min-height:62px}
a.chan:hover{border-color:var(--brand)}
.chan .ic{width:42px;height:42px;padding:10px;border-radius:12px;background:var(--soft);color:var(--brand)}
.chan small{display:block;color:var(--muted);font-size:13px;line-height:1.4}.chan b{display:block;font-size:15px;line-height:1.4;direction:ltr;text-align:start;word-break:break-all}
.chan.txt b{direction:inherit}
.done{text-align:center;padding:14px 4px}.done .ic{width:56px;height:56px;color:var(--ok);display:block;margin:0 auto 8px}
.done code{display:inline-block;background:#effaf5;border:1px dashed var(--ok);color:#0b7a53;border-radius:10px;padding:4px 14px;font-weight:700;direction:ltr;margin:8px 0}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:18px 5% calc(18px + env(safe-area-inset-bottom))}
@media(max-width:820px){.contact{grid-template-columns:1fr}.side{order:-1}.panel{padding:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script>
(function(){
 var q=new URLSearchParams(location.search),s=null;try{s=localStorage.getItem('daghtaLang')}catch(e){}
 var p=q.get('lang');window.LANG=(p==='en'||p==='ar')?p:(s==='en'?'en':'ar');
 window.setLang=function(l){window.LANG=l;try{localStorage.setItem('daghtaLang',l)}catch(e){}
  var d=document,r=d.documentElement;r.lang=l;r.dir=l==='ar'?'rtl':'ltr';
  d.querySelectorAll('[data-ar]').forEach(function(e){var v=e.getAttribute('data-'+l);if(v!==null)e.textContent=v});
  d.querySelectorAll('[data-ph-ar]').forEach(function(e){e.placeholder=e.getAttribute('data-ph-'+l)});
  d.querySelectorAll('[data-logo-ar]').forEach(function(e){e.src=e.getAttribute('data-logo-'+l)});
  var b=d.getElementById('langBtn');if(b)b.querySelector('span').textContent=l==='ar'?'English':'العربية';
  if(window.onLang)window.onLang(l)};
 document.addEventListener('DOMContentLoaded',function(){
  var b=document.getElementById('langBtn');if(b)b.addEventListener('click',function(){setLang(LANG==='ar'?'en':'ar')});
  document.querySelectorAll('[data-toggle]').forEach(function(x){x.addEventListener('click',function(){
   var i=document.getElementById(x.getAttribute('data-toggle')),sh=i.type==='password';i.type=sh?'text':'password';x.classList.toggle('on',sh)})});
  setLang(LANG)});
})();
</script>

const AFTER_SIGNUP = "create_ar.html";   // صفحة إنشاء المتجر بعد التسجيل
const I18N = {
 ar:{req:"املأ كل الحقول المطلوبة.",email:"اكتب بريد إلكتروني صحيح.",name:"اكتب اسمك (حرفين على الأقل).",pwShort:"كلمة المرور لازم تكون 8 أحرف على الأقل.",pwMatch:"كلمتا المرور غير متطابقتين.",terms:"لازم توافق على الشروط وسياسة الخصوصية.",wrong:"البريد أو كلمة المرور غير صحيحة.",exists:"البريد ده مسجّل بالفعل. جرّب تسجيل الدخول.",many:"محاولات كتير. استنى شوية وجرّب تاني.",net:"مشكلة في الاتصال. تأكد من الإنترنت.",cfg:"إعدادات Firebase ناقصة: ضع apiKey الكامل في الملف.",gen:"حصلت مشكلة. حاول مرة تانية.",popup:"اتقفلت نافذة جوجل قبل ما تكمل.",sent:"لو البريد ده مسجّل، هيوصلك رابط إعادة تعيين كلمة المرور."},
 en:{req:"Please fill in all required fields.",email:"Enter a valid email address.",name:"Enter your name (at least 2 characters).",pwShort:"Password must be at least 8 characters.",pwMatch:"Passwords do not match.",terms:"You must accept the terms and privacy policy.",wrong:"Incorrect email or password.",exists:"This email is already registered. Try signing in.",many:"Too many attempts. Please wait and try again.",net:"Network problem. Check your connection.",cfg:"Firebase is not configured: add the full apiKey in the file.",gen:"Something went wrong. Please try again.",popup:"The Google window was closed before finishing.",sent:"If this email is registered, a password reset link is on its way."}
};
const $ = id => document.getElementById(id);
const T = k => I18N[window.LANG][k];
const say = (type, key) => { const m = $('msg'); m.className = 'msg ' + type; m.dataset.key = key; m.textContent = T(key); };
const clear = () => { const m = $('msg'); m.className = 'msg'; m.dataset.key = ''; m.textContent = ''; };
window.onLang = () => { const m = $('msg'); if (m.dataset.key) m.textContent = T(m.dataset.key); };
const busy = (b, on) => b.classList.toggle('busy', on);
const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const errKey = c => ({ 'auth/invalid-credential':'wrong','auth/wrong-password':'wrong','auth/user-not-found':'wrong','auth/invalid-email':'email','auth/email-already-in-use':'exists','auth/weak-password':'pwShort','auth/too-many-requests':'many','auth/network-request-failed':'net','auth/popup-closed-by-user':'popup','auth/cancelled-popup-request':'popup' }[c] || 'gen');
const auth = cfgOk ? getAuth(initializeApp(firebaseConfig)) : null;

function pane(name) {
 ['login','reg','reset'].forEach(n => $(n + 'Form').hidden = n !== name);
 $('tabs').hidden = name === 'reset'; $('social').hidden = name === 'reset';
 $('tabLogin').setAttribute('aria-selected', name === 'login'); $('tabReg').setAttribute('aria-selected', name === 'reg');
 clear();
}
$('tabLogin').onclick = () => pane('login'); $('tabReg').onclick = () => pane('reg');
$('forgotBtn').onclick = () => { $('rEmail').value = $('lEmail').value; pane('reset'); };
$('resetBack').onclick = () => pane('login');
const wantReg = new URLSearchParams(location.search).get('mode') === 'register' || location.hash === '#register';
pane(wantReg ? 'reg' : 'login');

const go = url => { location.href = url; };
async function run(btn, fn) {
 if (!cfgOk) return say('err', 'cfg');
 busy(btn, true);
 try { await fn(); } catch (e) { say('err', errKey(e.code)); } finally { busy(btn, false); }
}
$('loginForm').addEventListener('submit', e => { e.preventDefault();
 const em = $('lEmail').value.trim(), pw = $('lPass').value;
 if (!em || !pw) return say('err', 'req'); if (!isEmail(em)) return say('err', 'email');
 run(e.submitter || $('loginBtn'), async () => { 
  const cred = await signInWithEmailAndPassword(auth, em, pw); 
  if (cred.user && cred.user.email && cred.user.email.toLowerCase().trim() === 'mohamed.ramamda1989@gmail.com') {
    go('admin.html');
  } else {
    go(AFTER_LOGIN);
  }
 });
});
$('regForm').addEventListener('submit', e => { e.preventDefault();
 const nm = $('gName').value.trim(), em = $('gEmail').value.trim(), pw = $('gPass').value, pw2 = $('gPass2').value;
 if (!nm || !em || !pw || !pw2) return say('err', 'req');
 if (nm.length < 2) return say('err', 'name'); if (!isEmail(em)) return say('err', 'email');
 if (pw.length < 8) return say('err', 'pwShort'); if (pw !== pw2) return say('err', 'pwMatch');
 if (!$('gTerms').checked) return say('err', 'terms');
 run(e.submitter || $('regBtn'), async () => { const c = await createUserWithEmailAndPassword(auth, em, pw); await updateProfile(c.user, { displayName: nm }); go(AFTER_SIGNUP); });
});
$('resetForm').addEventListener('submit', e => { e.preventDefault();
 const em = $('rEmail').value.trim(); if (!isEmail(em)) return say('err', 'email');
 run($('resetBtn'), async () => { try { await sendPasswordResetEmail(auth, em); } catch (x) { if (x.code !== 'auth/user-not-found') throw x; } say('ok', 'sent'); });
});
$('googleBtn').onclick = () => run($('googleBtn'), async () => {
 const p = new GoogleAuthProvider();
 try { 
   const res = await signInWithPopup(auth, p); 
   if (res.user && res.user.email && res.user.email.toLowerCase().trim() === 'mohamed.ramamda1989@gmail.com') {
     go('admin.html');
   } else {
     go(AFTER_LOGIN);
   }
 }
 catch (e) { if (e.code === 'auth/popup-blocked') return signInWithRedirect(auth, p); throw e; }
});
if (auth) getRedirectResult(auth).then(r => { if (r) go(AFTER_LOGIN); }).catch(() => {});
</script>
</body>
</html>
